name: RC IT Services CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-it-services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Architecture, test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source architecture
        run: npm run check:architecture

      - name: Run smoke and regression tests
        run: npm test

      - name: Build optimized prerendered production assets
        run: npm run build

      - name: Enforce production performance budgets
        run: npm run test:performance

      - name: Verify prerendered SEO production output
        run: npm run test:seo-build

      - name: Verify production bundle and Cloudflare configuration
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/_redirects
          test -d dist/assets
          test -f wrangler.jsonc
          test -f worker/index.js
          test -f src/frontend/app/app.js
          test -f src/frontend/styles/app.css
          test -f src/backend/runtime/worker.js
          grep -q 'site-root' dist/index.html
          grep -q 'data-route-styles' dist/index.html
          grep -q 'data-prerendered-path' dist/index.html
          grep -q '404-page' wrangler.jsonc
          grep -q 'drop-trailing-slash' wrangler.jsonc
          grep -q 'rcitcservices' wrangler.jsonc
          grep -q 'serveApplication' worker/index.js
          grep -q 'getPrerenderRoutes' scripts/build.mjs

  production-route-smoke:
    name: Verify live production routes
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wait for current Cloudflare prerender build and verify deep routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rcitcservices.frsmkgit.workers.dev'
          routes=(
            '/'
            '/careers'
            '/contact'
            '/services/it/cyber-security'
            '/services/it/consultancy-services/agile'
            '/careers/jobs/senior-data-engineer'
            '/privacy'
          )

          for attempt in $(seq 1 30); do
            all_ok=1
            for route in "${routes[@]}"; do
              code=$(curl -sS -o /tmp/rc-page.html -w '%{http_code}' "${BASE}${route}" || true)
              if [[ "$code" != '200' ]] || ! grep -q 'id="main-content"' /tmp/rc-page.html || ! grep -q 'data-prerendered-path=' /tmp/rc-page.html; then
                all_ok=0
                break
              fi
            done

            health_code=$(curl -sS -o /tmp/rc-health.json -w '%{http_code}' "${BASE}/api/health" || true)
            if [[ "$health_code" != '200' ]] || ! grep -q '"ok":true' /tmp/rc-health.json; then
              all_ok=0
            fi

            root_code=$(curl -sS -o /tmp/rc-deployment.html -w '%{http_code}' "${BASE}/" || true)
            if [[ "$root_code" != '200' ]] || ! grep -q 'data-prerendered-path="/"' /tmp/rc-deployment.html || ! grep -q 'global-overrides-' /tmp/rc-deployment.html || ! grep -q 'application/ld+json' /tmp/rc-deployment.html; then
              all_ok=0
            fi

            if [[ "$all_ok" == '1' ]]; then
              echo "Current Phase 6 Cloudflare prerender build verified on attempt ${attempt}."
              break
            fi

            if [[ "$attempt" == '30' ]]; then
              echo 'Current Cloudflare Phase 6 prerender build did not become healthy within the verification window.' >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify production SEO, redirects and 404 behaviour
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rcitcservices.frsmkgit.workers.dev'

          curl -sS "${BASE}/about-us" -o /tmp/about.html
          grep -q "rel=\"canonical\" href=\"${BASE}/about-us\"" /tmp/about.html
          grep -q 'property="og:title"' /tmp/about.html
          grep -q 'application/ld+json' /tmp/about.html

          curl -sS "${BASE}/services/it/cyber-security" -o /tmp/service.html
          grep -q '"@type":"Service"' /tmp/service.html
          grep -q 'BreadcrumbList' /tmp/service.html

          curl -sS "${BASE}/careers/jobs/senior-data-engineer" -o /tmp/job.html
          grep -q "rel=\"canonical\" href=\"${BASE}/careers/jobs/senior-data-engineer\"" /tmp/job.html
          grep -q 'name="robots" content="noindex,nofollow"' /tmp/job.html
          ! grep -q '"@type":"JobPosting"' /tmp/job.html

          curl -sS "${BASE}/login" -o /tmp/login.html
          grep -q 'name="robots" content="noindex,nofollow"' /tmp/login.html

          curl -sS "${BASE}/sitemap.xml" -o /tmp/sitemap.xml
          grep -q '<urlset' /tmp/sitemap.xml
          grep -q "${BASE}/services/it/cyber-security" /tmp/sitemap.xml
          ! grep -q "${BASE}/login" /tmp/sitemap.xml
          ! grep -q '/apply</loc>' /tmp/sitemap.xml
          ! grep -q "${BASE}/careers/jobs/senior-data-engineer</loc>" /tmp/sitemap.xml

          curl -sS "${BASE}/robots.txt" -o /tmp/robots.txt
          ! grep -q 'Disallow: /login' /tmp/robots.txt
          ! grep -q 'Disallow: /careers/jobs/' /tmp/robots.txt
          grep -q 'Disallow: /api/' /tmp/robots.txt
          grep -q 'Disallow: /admin/' /tmp/robots.txt
          grep -q "Sitemap: ${BASE}/sitemap.xml" /tmp/robots.txt

          unknown_code=$(curl -sS -o /tmp/not-found.html -w '%{http_code}' "${BASE}/definitely-not-a-real-rc-route")
          test "$unknown_code" = '404'
          grep -q 'noindex,nofollow' /tmp/not-found.html
          grep -q 'Page not found' /tmp/not-found.html

          alias_code=$(curl -sS -o /dev/null -w '%{http_code}' "${BASE}/careers/job-opportunities")
          [[ "$alias_code" == '301' || "$alias_code" == '308' ]]
          curl -sSI "${BASE}/careers/job-opportunities" | tr -d '\r' | grep -qi '^location:.*\/careers'

          echo 'Production metadata, eligibility gating, schema, sitemap, robots, redirects and real 404 behaviour verified.'

      - name: Verify production cache policy and split assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rcitcservices.frsmkgit.workers.dev'

          curl -sS "${BASE}/" -o /tmp/rc-index.html
          app_asset=$(grep -oE '/assets/app-[A-Za-z0-9]+\.js' /tmp/rc-index.html | head -n1)
          if [[ -z "$app_asset" ]]; then
            echo 'Hashed application JavaScript was not found in production HTML.' >&2
            exit 1
          fi
          curl -sSI "${BASE}${app_asset}" | tr -d '\r' | grep -qi 'cache-control:.*max-age=31536000.*immutable' || {
            echo 'Application JavaScript is missing immutable cache headers.' >&2
            exit 1
          }

          route_assets=$(grep -oE 'route-(careers|services|legal)-[A-Za-z0-9]+\.css' /tmp/rc-index.html | sort -u)
          route_count=$(printf '%s\n' "$route_assets" | sed '/^$/d' | wc -l | tr -d ' ')
          if [[ "$route_count" != '3' ]]; then
            echo "Expected 3 production route stylesheets; found ${route_count}." >&2
            exit 1
          fi
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${BASE}/assets/${asset}")
            if [[ "$code" != '200' ]]; then
              echo "Production route stylesheet ${asset} returned ${code}." >&2
              exit 1
            fi
            curl -sSI "${BASE}/assets/${asset}" | tr -d '\r' | grep -qi 'cache-control:.*max-age=31536000.*immutable' || {
              echo "Production route stylesheet ${asset} is missing immutable cache headers." >&2
              exit 1
            }
          done <<< "$route_assets"

          curl -sSI "${BASE}/about-us" | tr -d '\r' | grep -qi 'cache-control:.*max-age=0.*must-revalidate' || {
            echo 'Production prerendered HTML is missing the required revalidation cache policy.' >&2
            exit 1
          }
          echo 'Cloudflare prerendered HTML revalidation and immutable split-asset caching verified.'

      - name: Verify Vercel fallback routes remain reachable
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rc-it-services.vercel.app'
          for route in '/' '/careers' '/contact' '/services/it/cyber-security' '/privacy'; do
            code=$(curl -L -sS -o /tmp/vercel-page.html -w '%{http_code}' "${BASE}${route}")
            test "$code" = '200'
            grep -q 'site-root' /tmp/vercel-page.html
          done
          echo 'Vercel fallback routes are reachable.'

      - name: Deployment ownership
        run: |
          echo 'CI and live-route verification passed.'
          echo 'Cloudflare Workers Builds is the primary CD path from main.'
          echo 'Vercel is retained as a secondary live fallback.'
