name: Phase 11 Public Careers Edge Verification

on:
  push:
    branches: [phase-11-live-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-careers-edge:
    name: Verify deployed public Careers boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise public Careers Edge Function
        shell: bash
        run: |
          set -euo pipefail
          API='https://chsizmffzpxcqhaptjeu.supabase.co/functions/v1/public-careers'

          health_code=$(curl -sS -D /tmp/health.headers -o /tmp/health.json -w '%{http_code}' "${API}/health")
          test "$health_code" = '200'
          grep -q '"ok":true' /tmp/health.json
          grep -q '"service":"public-careers"' /tmp/health.json
          grep -q '"contract":"phase11-public-read-v1"' /tmp/health.json
          ! tr -d '\r' < /tmp/health.headers | grep -qi '^access-control-allow-origin:'
          tr -d '\r' < /tmp/health.headers | grep -qi '^cache-control:.*no-store'

          list_code=$(curl -sS -D /tmp/list.headers -o /tmp/list.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"slug":null}' "${API}")
          test "$list_code" = '200'
          grep -q '"jobs":\[' /tmp/list.json
          grep -q '"selected":' /tmp/list.json
          grep -q '"slug":"senior-data-engineer"' /tmp/list.json
          ! grep -Eq 'password_hash|csrf|service_role|secret_key|admin_id' /tmp/list.json

          detail_code=$(curl -sS -o /tmp/detail.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"slug":"senior-data-engineer"}' "${API}")
          test "$detail_code" = '200'
          grep -q '"selected":{' /tmp/detail.json
          grep -q '"slug":"senior-data-engineer"' /tmp/detail.json
          grep -q '"required_skills":' /tmp/detail.json
          grep -q '"preferred_skills":' /tmp/detail.json
          grep -q '"application_response_window":' /tmp/detail.json
          ! grep -Eq 'password_hash|csrf|service_role|secret_key|admin_id' /tmp/detail.json

          invalid_code=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"slug":"BAD SLUG"}' "${API}")
          test "$invalid_code" = '400'
          grep -q '"code":"INVALID_SLUG"' /tmp/invalid.json

          media_code=$(curl -sS -o /tmp/media.json -w '%{http_code}' --data '{}' "${API}")
          test "$media_code" = '415'
          grep -q '"code":"UNSUPPORTED_MEDIA_TYPE"' /tmp/media.json

          get_code=$(curl -sS -D /tmp/get.headers -o /tmp/get.json -w '%{http_code}' "${API}")
          test "$get_code" = '405'
          tr -d '\r' < /tmp/get.headers | grep -qi '^allow: *POST'
          grep -q '"code":"METHOD_NOT_ALLOWED"' /tmp/get.json

          python3 - <<'PY'
          import json
          with open('/tmp/oversized.json', 'w', encoding='utf-8') as f:
              json.dump({'slug': 'a' * 3000}, f)
          PY
          large_code=$(curl -sS -o /tmp/large.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/oversized.json "${API}")
          test "$large_code" = '413'
          grep -q '"code":"PAYLOAD_TOO_LARGE"' /tmp/large.json

          echo 'PASS: deployed public Careers Edge boundary returns only public vacancy data and rejects invalid/oversized/unsupported requests.'
