name: Phase 12 Secret Presence Diagnostic

on:
  push:
    branches: [phase-12-live-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SB_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SB_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report required secret presence only
        shell: bash
        run: |
          report() {
            local name="$1" value="$2"
            if [[ -n "$value" ]]; then echo "$name=present"; else echo "$name=missing"; fi
          }
          report CLOUDFLARE_API_TOKEN "$CF_API_TOKEN"
          report CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT_ID"
          report SUPABASE_SECRET_KEY "$SB_SECRET_KEY"
          report SUPABASE_SERVICE_ROLE_KEY "$SB_SERVICE_ROLE_KEY"
