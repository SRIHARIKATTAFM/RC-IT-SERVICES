name: Phase 12 Public Boundary Diagnostic

on:
  push:
    branches: [phase-12-production-acceptance-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print live SEO origin contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rc-it-consulting-services.rcitcservices.workers.dev'
          curl -sS "${BASE}/about-us" -o /tmp/about.html
          curl -sS "${BASE}/careers/jobs/senior-data-engineer" -o /tmp/job.html
          curl -sS "${BASE}/sitemap.xml" -o /tmp/sitemap.xml
          curl -sS "${BASE}/robots.txt" -o /tmp/robots.txt
          printf 'ABOUT_CANONICAL='; grep -oE 'rel="canonical" href="[^"]+"' /tmp/about.html | head -n1 || true
          printf 'JOB_CANONICAL='; grep -oE 'rel="canonical" href="[^"]+"' /tmp/job.html | head -n1 || true
          printf 'SITEMAP_SAMPLE='; grep -oE '<loc>[^<]+' /tmp/sitemap.xml | head -n3 | tr '\n' ' '; echo
          printf 'ROBOTS_SITEMAP='; grep '^Sitemap:' /tmp/robots.txt | head -n1 || true
